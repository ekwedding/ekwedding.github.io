<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Είσοδος γάμου</title>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600&family=GFS+Didot&display=swap" rel="stylesheet">
<style>:root{--g:#36463a;--d:#27332a;--k:#b38444;--t:#e6dfae;--p:#d6ce9b}*{box-sizing:border-box}body{margin:0;background:var(--g);color:var(--t);font:400 16px Commissioner,system-ui,sans-serif;border-top:8px solid var(--k);min-height:100vh}
main{max-width:1100px;margin:auto;padding:16px}h1{font:400 26px "GFS Didot",serif;margin:6px 0 12px}input{width:100%;font:inherit;font-size:18px;padding:13px;border:0;border-radius:4px;color:#222;background:#fff}
button{font:inherit;cursor:pointer}.tabs{display:flex;gap:8px;margin:0 0 14px}.tabs button{flex:1;min-height:46px;border-radius:4px;border:1px solid var(--p);background:none;color:var(--t)}.tabs button.on{background:var(--p);color:var(--d);font-weight:600}
.r{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:rgba(255,255,255,.08);border-radius:4px;padding:11px;margin-top:8px}.r b{font-weight:600;color:#f7f1c8}.r small{display:block;color:var(--p);margin-top:2px}.t{font:400 28px "GFS Didot",serif;color:#f7f1c8;text-align:center;min-width:54px}.t small{font:12px Commissioner;color:var(--p)}.ok{width:26px;height:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}.card{background:rgba(255,255,255,.06);border-radius:6px;padding:6px;cursor:pointer}.card.sel{outline:2px solid var(--k)}.card.over{background:rgba(190,60,50,.35)}svg{display:block;width:100%;height:auto}svg text{fill:var(--t);font:11px Commissioner,sans-serif}.seat{cursor:pointer}.note{font-size:14px;color:var(--p);margin:8px 0 12px;line-height:1.4}#msg{position:sticky;top:0;background:var(--k);color:#1c241d;padding:9px 12px;border-radius:4px;margin-bottom:10px;font-weight:500}
.err{color:#ffb4a8;margin-top:8px}#vI h2{font:400 22px "GFS Didot",serif;margin:22px 0 6px;color:#f7f1c8}#vI a{color:#f7f1c8}.i{background:rgba(255,255,255,.08);border-radius:4px;padding:10px 11px;margin-top:6px}.i b{color:#f7f1c8;font-weight:600}.i small{display:block;color:var(--p);margin-top:2px}.call{display:inline-block;margin-top:5px;padding:6px 12px;border:1px solid var(--p);border-radius:4px;text-decoration:none}.stat{display:flex;gap:8px}.stat div{flex:1;background:rgba(255,255,255,.08);border-radius:4px;padding:10px;text-align:center}.stat b{display:block;font:400 26px "GFS Didot",serif;color:#f7f1c8}</style></head><body><main>
<h1>Είσοδος γάμου</h1><div id="login"><p class="note">Γράψε τον κωδικό εισόδου.</p><form id="lf"><input id="code" type="password" inputmode="numeric" autocomplete="off" aria-label="Κωδικός"><p class="err" id="le" hidden>Λάθος κωδικός.</p></form></div>
<div id="app" hidden><div class="tabs"><button id="tS" class="on" type="button">Αναζήτηση</button><button id="tC" type="button">Τραπέζια</button><button id="tI" type="button">Χρήσιμα</button></div><div id="msg" hidden></div>
<section id="vS"><input id="q" placeholder="Γράψε όνομα…" autocomplete="off" aria-label="Όνομα"><div id="res"></div></section><section id="vC" hidden><div class="grid" id="grid"></div></section><section id="vI" hidden></section></div></main>
<script>
const API="https://script.google.com/macros/s/AKfycbyXsQxEqpwThf_YAv5o1yZVHXoVl8OiKRJQw1J4kpEOkjMKFUAl4oHK2LMycmeP4wcG3w/exec",$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GR={α:"a",β:"v",γ:"g",δ:"d",ε:"e",ζ:"z",η:"i",θ:"th",ι:"i",κ:"k",λ:"l",μ:"m",ν:"n",ξ:"ks",ο:"o",π:"p",ρ:"r",σ:"s",ς:"s",τ:"t",υ:"i",φ:"f",χ:"h",ψ:"ps",ω:"o"};
const norm=s=>{let t=String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/ου/g,"u").replace(/ευ/g,"ev").replace(/αυ/g,"av").replace(/γγ/g,"ng").replace(/γκ/g,"g").replace(/μπ/g,"b").replace(/ντ/g,"d").replace(/x/g,"h");return t.replace(/[α-ως]/g,c=>GR[c]||c).replace(/ou/g,"u").replace(/mp/g,"b").replace(/nt/g,"d").replace(/ph/g,"f").replace(/ch/g,"h").replace(/gg/g,"ng").replace(/gk/g,"g").replace(/y/g,"i").replace(/w/g,"o").replace(/ai/g,"e").replace(/[eo]i/g,"i").replace(/([a-z])\1/g,"$1")};
let code="",D={people:[],tables:[]},picked=null;
const post=b=>fetch(API,{method:"POST",body:JSON.stringify(Object.assign({door:code},b))}).then(r=>r.json());
const say=(m,ms)=>{const e=$("#msg");e.textContent=m;e.hidden=!m;if(m&&ms)setTimeout(()=>{e.hidden=true},ms)};
const load=()=>fetch(API+"?door="+encodeURIComponent(code)).then(r=>r.json()).then(d=>{if(d.denied)throw 0;D=d;D.people.forEach(p=>p.k=norm(p.n));draw()});
/* everyone at a table, the companions of a row included, and "+n" for those without a name yet */
const atTable=t=>{const o=[];D.people.filter(p=>String(p.t)===String(t)).forEach(p=>{o.push(p);const m=/\+(\d+)/.exec(p.m||"");if(m)for(let i=0;i<+m[1];i++)o.push({n:"+1 ("+p.n.split(" ")[0]+")",anon:true,owner:p.n})});return o};
function drawS(){const q=norm($("#q").value).replace(/nadina/g,"konstadina").split(/\s+/).filter(Boolean),res=$("#res");if(!q.length){res.innerHTML="";return}const hit=D.people.filter(p=>q.every(w=>p.k.includes(w))).slice(0,30);
  res.innerHTML=hit.length?hit.map(p=>{const others=atTable(p.t).filter(o=>o.n!==p.n&&!o.anon).map(o=>o.n);return`<div class="r"><div><b>${esc(p.n)}</b><small>${p.w?"Μαζί με: "+esc(p.w)+" · ":""}${p.m?esc(p.m)+" · ":""}${esc(p.a||"Δεν απάντησε")}</small>${others.length?`<small>Στο τραπέζι: ${esc(others.join(", "))}</small>`:""}</div><div class="t">${esc(p.t||"–")}<br><small>τραπέζι</small></div><input class="ok" type="checkbox" aria-label="Ήρθε" data-n="${esc(p.n)}" ${p.ok?"checked":""}></div>`}).join(""):'<p class="note">Δεν βρέθηκε κανείς.</p>';
  res.querySelectorAll(".ok").forEach(c=>c.addEventListener("change",()=>{const p=D.people.find(x=>x.n===c.dataset.n);if(p)p.ok=c.checked;post({action:"arrived",n:c.dataset.n,ok:c.checked}).catch(()=>say("Δεν αποθηκεύτηκε, δοκίμασε ξανά",3000))}))}
function drawC(){const used=D.tables.filter(t=>atTable(t.t).length||String(t.t)===String(picked&&picked.to));const last=Math.max(0,...used.map(t=>+t.t)),show=D.tables.filter(t=>+t.t<=last+1);
  $("#grid").innerHTML=show.map(t=>{const P=atTable(t.t),n=Math.max(t.cap,P.length),c=170,R=66,over=P.length>t.cap;const seats=Array.from({length:n},(_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,x=c+Math.cos(a)*(R+15),y=c+Math.sin(a)*(R+15),lx=c+Math.cos(a)*(R+25),ly=c+Math.sin(a)*(R+25),p=P[i],right=Math.cos(a)>=0,sel=false,w=p?p.n.split(" (")[0].split(" "):[],label=w.length>1?w[0]+" "+w[1][0]+".":w.join(" ");return`<g class="seat" data-n="${p?esc(p.anon?p.owner:p.n):""}"><circle cx="${x}" cy="${y}" r="9" fill="${sel?"#e8c469":p?"#d6ce9b":"none"}" stroke="#d6ce9b"/>${p?`<text x="${lx}" y="${ly+4}" text-anchor="${Math.abs(Math.cos(a))<.2?"middle":right?"start":"end"}" transform="${Math.abs(Math.cos(a))<.2?`translate(0 ${Math.sin(a)>0?12:-12})`:""}">${esc(label.length>19?label.slice(0,18)+"…":label)}</text>`:""}</g>`}).join("");
    return`<div class="card ${over?"over":""}" data-t="${t.t}"><svg viewBox="0 0 340 340" role="img" aria-label="Τραπέζι ${t.t}"><circle cx="${c}" cy="${c}" r="${R}" fill="#27332a" stroke="#b38444" stroke-width="3"/><text x="${c}" y="${c-3}" text-anchor="middle" style="font:400 30px 'GFS Didot',serif">${t.t}</text><text x="${c}" y="${c+18}" text-anchor="middle">${P.length} / ${t.cap}</text>${t.name?`<text x="${c}" y="${c+33}" text-anchor="middle">${esc(t.name)}</text>`:""}${seats}</svg></div>`}).join("");
}
function drawI(){const I=D.info||{},tel=p=>p?`<a class="call" href="tel:${esc(String(p).replace(/[^+\d]/g,""))}">Κλήση ${esc(p)}</a>`:"",box=(t,sub,x)=>`<div class="i"><b>${esc(t)}</b>${sub?`<small>${esc(sub)}</small>`:""}${x||""}</div>`,sec=(t,a)=>a&&a.length?`<h2>${t}</h2>${a.join("")}`:"",T=I.totals||{};
  $("#vI").innerHTML=`<div class="stat"><div><b>${T.arrived||0}</b>ήρθαν</div><div><b>${(T.people||0)-(T.arrived||0)}</b>δεν ήρθαν ακόμα</div></div>
  <h2>Χώρος</h2><div class="i"><b>Domaine Braimnioti Mediterranean</b><small>Κορωπί 166 72 · Η εκκλησία και η δεξίωση είναι στο ίδιο κτήμα · 19:30 γάμος, 21:00 δείπνο</small><a class="call" href="https://maps.app.goo.gl/63D9LbdJddfpLr5d6" target="_blank" rel="noopener">Χάρτης</a></div>`+
  sec("Πρόγραμμα",(I.day||[]).map(r=>box((r[0]?r[0]+" · ":"")+r[1],[r[2],r[3]].filter(Boolean).join(" · "),tel(r[4]))))+
  sec("Τηλέφωνα",(I.contacts||[]).map(r=>box(r[0]+(r[1]?": "+r[1]:""),[r[3],r[5]?"Άφιξη "+r[5]:"",r[4]?"Αναπληρωτής: "+r[4]:""].filter(Boolean).join(" · "),tel(r[2]))))+
  sec("Διατροφή και ειδικές ανάγκες",(I.diet||[]).map(r=>box(r[0],(r[1]?"Τραπέζι "+r[1]+" · ":"")+r[2])))+
  sec("Μεταφορές",(I.stay||[]).map(r=>box(r[0],r[1],tel(r[2]))))+
  sec("Στιγμές και τραγούδια",(I.moments||[]).map(r=>box(r[0]+": "+r[1],[r[2],r[3]].filter(Boolean).join(" · "))))+
  sec("Plan B και κιτ",(I.planb||[]).map(r=>box(r[0],[r[1],r[2]].filter(Boolean).join(" · "))))}
function draw(){drawS();drawC();drawI()}
const tab=v=>{["S","C","I"].forEach(k=>{$("#v"+k).hidden=k!==v;$("#t"+k).classList.toggle("on",k===v)})};
["S","C","I"].forEach(k=>$("#t"+k).addEventListener("click",()=>tab(k)));$("#q").addEventListener("input",drawS);
const enter=v=>{code=v;$("#le").hidden=true;return load().then(()=>{try{sessionStorage.setItem("door",v)}catch(e){}$("#login").hidden=true;$("#app").hidden=false;$("#q").focus();setInterval(()=>{if(!picked&&document.activeElement!==null)load().catch(()=>{})},60000)})};
$("#lf").addEventListener("submit",e=>{e.preventDefault();enter($("#code").value.trim()).catch(()=>{$("#le").hidden=false})});
try{const c=location.hash.slice(1)||sessionStorage.getItem("door");if(c)enter(c).catch(()=>{})}catch(e){}
</script></body></html>
