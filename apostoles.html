<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Αποστολές · γάμος</title>
<link href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,wght@1,300&family=Ysabeau:wght@400;500;600&display=swap" rel="stylesheet">
<style>[hidden]{display:none!important}:root{--g:#1f3b2d;--d:#15291f;--iv:#f5ece0;--gold:#d9b46a;--line:rgba(245,236,224,.22)}*{box-sizing:border-box}
body{margin:0;background:var(--g);color:var(--iv);font:400 16px Ysabeau,system-ui,sans-serif}main{max-width:720px;margin:auto;padding:16px 16px 80px}
h1{font:italic 300 32px Piazzolla,serif;margin:8px 0 4px}.muted{color:rgba(245,236,224,.75);font-size:14px;margin:0 0 14px}
input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:0;border-radius:12px;color:#222;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chips button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--iv);font:600 13px Ysabeau,sans-serif}.chips button.on{background:var(--iv);color:var(--g)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 6px}.stats div{border:1px solid var(--line);border-radius:14px;padding:10px 12px}.stats b{font:italic 300 28px Piazzolla,serif;color:var(--gold)}.stats small{display:block;opacity:.8}
.r{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;border-bottom:1px solid var(--line);padding:12px 2px}
.r .n b{font-weight:600}.r .n small{display:block;opacity:.7;font-size:13px}
.t{display:flex;gap:6px}.t button{min-width:92px;min-height:40px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--iv);font:600 12px Ysabeau,sans-serif;letter-spacing:.04em}
.t button.on{background:var(--gold);border-color:var(--gold);color:#1f2a20}
.wa{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}.wa a{font-size:13px;color:var(--gold);text-decoration:none;border:1px dashed rgba(217,180,106,.6);border-radius:999px;padding:6px 12px}
#login{max-width:420px}button.go{margin-top:10px;width:100%;min-height:48px;border-radius:12px;border:0;background:var(--gold);color:#1f2a20;font:600 15px Ysabeau,sans-serif}
.err{color:#f2b8ad}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--iv);color:var(--g);padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .3s}.toast.on{opacity:1}
</style></head><body><main>
<h1>Αποστολές</h1><p class="muted">Σημείωσε σε ποιον έστειλες save the date και πρόσκληση. Ό,τι πατάς γράφεται αμέσως στο Sheet (στήλες «Save the date» και «Πρόσκληση» στους Καλεσμένους).</p>
<div id="login" hidden><form id="lf"><input id="code" type="password" autocomplete="off" autocapitalize="off" placeholder="Κωδικός"><button class="go">Είσοδος</button></form><p class="err" id="le"></p></div>
<div id="app" hidden>
 <div class="stats"><div><b id="sS">0</b><small>Save the date στάλθηκαν</small></div><div><b id="sI">0</b><small>Προσκλήσεις στάλθηκαν</small></div></div>
 <input id="q" placeholder="Γράψε όνομα…" autocomplete="off">
 <div class="chips" id="f"><button data-f="all" class="on">Όλοι</button><button data-f="nostd">Χωρίς save the date</button><button data-f="noinv">Χωρίς πρόσκληση</button><button data-f="phone">Με τηλέφωνο</button></div>
 <div id="list"></div></div>
<div class="toast" id="toast"></div>
</main><script>
const API="https://script.google.com/macros/s/AKfycbyXsQxEqpwThf_YAv5o1yZVHXoVl8OiKRJQw1J4kpEOkjMKFUAl4oHK2LMycmeP4wcG3w/exec";
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fold=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
let code=location.hash.slice(1)||sessionStorage.getItem("send")||"",D=[],flt="all";
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)};
/* WhatsApp: a ready message with the link; tapping it also ticks the box */
const MSG={std:n=>`Γεια σου ${n}! Κράτα την ημερομηνία: Παρασκευή 20 Αυγούστου 2027, ο γάμος μας στο Κορωπί. Η πρόσκληση έρχεται σύντομα! Ευάγγελος & Κωνσταντίνα Αλίκη`,
  inv:n=>`Γεια σου ${n}! Με μεγάλη μας χαρά σε προσκαλούμε στον γάμο μας, Παρασκευή 20 Αυγούστου 2027. Δες την πρόσκληση και πες μας αν θα έρθεις εδώ: https://ekwedding.github.io/`};
const tel=p=>{let d=String(p||"").replace(/[^\d+]/g,"");if(!d)return"";if(d.startsWith("+"))d=d.slice(1);else if(d.startsWith("00"))d=d.slice(2);else if(/^69\d{8}$/.test(d)||/^2\d{9}$/.test(d))d="30"+d;return d.length>=10?d:""};
function load(){fetch(API+"?send="+encodeURIComponent(code)).then(r=>r.json()).then(d=>{if(d.denied){sessionStorage.removeItem("send");$("#login").hidden=false;$("#app").hidden=true;$("#le").textContent=code?"Λάθος κωδικός.":"";return}
  sessionStorage.setItem("send",code);$("#login").hidden=true;$("#app").hidden=false;D=d.people||[];draw()}).catch(()=>toast("Δεν φορτώθηκε, δοκίμασε ξανά"))}
function draw(){const q=fold($("#q").value.trim());$("#sS").textContent=D.filter(p=>p.std).length+" / "+D.length;$("#sI").textContent=D.filter(p=>p.inv).length+" / "+D.length;
  const L=D.filter(p=>(!q||fold(p.name+" "+p.call+" "+p.note+" "+p.group+" "+p.sub).includes(q))&&(flt==="all"||(flt==="nostd"&&!p.std)||(flt==="noinv"&&!p.inv)||(flt==="phone"&&tel(p.phone))));
  $("#list").innerHTML=L.map(p=>{const i=D.indexOf(p),t=tel(p.phone),hi=esc(p.call||p.name.split(" ")[0]);return`<div class="r"><div class="n"><b>${esc(p.name)}</b><small>${esc([p.note,p.sub||p.group].filter(Boolean).join(" · "))}</small></div>
   <div class="t"><button data-i="${i}" data-k="std" class="${p.std?"on":""}">${p.std?"✓ ":""}Save the date</button><button data-i="${i}" data-k="inv" class="${p.inv?"on":""}">${p.inv?"✓ ":""}Πρόσκληση</button></div>
   ${t?`<div class="wa"><a href="https://wa.me/${t}?text=${encodeURIComponent(MSG.std(hi))}" target="_blank" rel="noopener" data-i="${i}" data-k="std">WhatsApp: save the date</a><a href="https://wa.me/${t}?text=${encodeURIComponent(MSG.inv(hi))}" target="_blank" rel="noopener" data-i="${i}" data-k="inv">WhatsApp: πρόσκληση</a></div>`:""}</div>`}).join("")||'<p class="muted">Κανείς.</p>';
  $("#list").querySelectorAll("button[data-k]").forEach(b=>b.onclick=()=>set(D[+b.dataset.i],b.dataset.k,!D[+b.dataset.i][b.dataset.k]));
  $("#list").querySelectorAll("a[data-k]").forEach(a=>a.addEventListener("click",()=>{const p=D[+a.dataset.i];if(!p[a.dataset.k])set(p,a.dataset.k,true)}))}
function set(p,k,on){p[k]=on;draw();fetch(API,{method:"POST",body:JSON.stringify({send:code,row:p.row,name:p.name,kind:k,on})}).then(r=>r.json()).then(d=>{if(d.ok)toast(on?"Σημειώθηκε":"Αφαιρέθηκε");else{p[k]=!on;draw();toast(d.moved?"Η λίστα άλλαξε, ξαναφορτώνω":"Δεν αποθηκεύτηκε");if(d.moved)load()}}).catch(()=>{p[k]=!on;draw();toast("Δεν αποθηκεύτηκε")})}
$("#q").addEventListener("input",draw);$("#f").querySelectorAll("button").forEach(b=>b.onclick=()=>{flt=b.dataset.f;$("#f").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));draw()});
$("#lf").addEventListener("submit",e=>{e.preventDefault();code=$("#code").value.trim();load()});
if(code)load();else $("#login").hidden=false;history.replaceState(null,"",location.pathname);
</script></body></html>
