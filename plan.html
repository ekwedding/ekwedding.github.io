<style>:root{--g:#36463a;--d:#27332a;--k:#b38444;--t:#e6dfae;--p:#d6ce9b;--r:#d9574a;--y:#d9a83f}*{box-sizing:border-box}body{margin:0;background:var(--g);color:var(--t);font:400 15px Commissioner,system-ui,sans-serif;border-top:8px solid var(--k);min-height:100vh}

.sug{background:#fff;color:#222;border-radius:0 0 4px 4px;max-height:280px;overflow:auto}.sug button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eee;color:#222;border-radius:0}.sug small{color:#777;margin-left:6px}.who{font-size:18px;color:#f7f1c8;font-weight:600;margin:10px 0 2px}.muted{color:var(--p);font-size:13px}.rel{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(214,206,155,.2)}.rel button{min-height:32px;padding:0 9px}.k{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.iss{padding:7px 9px;border-radius:4px;margin-top:5px;font-size:14px;line-height:1.35;cursor:pointer}.iss.error{background:rgba(217,87,74,.4)}.iss.warn{background:rgba(217,168,63,.28)}.iss.info{background:rgba(255,255,255,.08)}
#dlg{position:fixed;inset:0;background:rgba(10,16,12,.72);display:grid;place-items:center;padding:16px;z-index:9}#dlg[hidden]{display:none}#box{background:var(--d);border:1px solid var(--k);border-radius:8px;padding:18px;max-width:480px;width:100%;max-height:90vh;overflow:auto}#box .acts{display:grid;gap:8px;margin-top:14px}#msg{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--k);color:#1c241d;padding:9px 14px;border-radius:4px;font-weight:500;z-index:8;max-width:90vw}.err{color:#ffb4a8;margin-top:8px}</style></head><body><main>
<h1>Πλάνο τραπεζιών</h1><div id="login"><form id="lf"><input id="code" type="password" inputmode="numeric" autocomplete="off" aria-label="Κωδικός" placeholder="Κωδικός"><p class="err" id="le" hidden>Λάθος κωδικός.</p></form></div>
<div id="app" hidden><div class="top"><button id="bP" type="button" class="main">Πρότεινε για όσους δεν έχουν τραπέζι</button><button id="bR" type="button">Στην τύχη (δοκιμή)</button><button id="bC" type="button">Άδειασε το πρόχειρο</button><button id="bU" type="button" disabled>↶ Αναίρεση</button></div>
<div class="lay"><div id="grid"></div><aside id="side"><input id="q" placeholder="Γράψε όνομα…" autocomplete="off" aria-label="Αναζήτηση ονόματος"><div class="sug" id="sug"></div><div id="det"></div><h2>Προβλήματα</h2><div id="iss"></div></aside></div></div></main>
<div id="dlg" hidden><div id="box" role="dialog" aria-modal="true"></div></div><div id="msg" hidden></div>
<script>
const API="https://script.google.com/macros/s/AKfycbyXsQxEqpwThf_YAv5o1yZVHXoVl8OiKRJQw1J4kpEOkjMKFUAl4oHK2LMycmeP4wcG3w/exec",$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GR={α:"a",β:"v",γ:"g",δ:"d",ε:"e",ζ:"z",η:"i",θ:"th",ι:"i",κ:"k",λ:"l",μ:"m",ν:"n",ξ:"ks",ο:"o",π:"p",ρ:"r",σ:"s",ς:"s",τ:"t",υ:"i",φ:"f",χ:"h",ψ:"ps",ω:"o"};
const norm=s=>{let t=String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/ου/g,"u").replace(/ευ/g,"ev").replace(/αυ/g,"av").replace(/γγ/g,"ng").replace(/γκ/g,"g").replace(/μπ/g,"b").replace(/ντ/g,"d").replace(/x/g,"h");return t.replace(/[α-ως]/g,c=>GR[c]||c).replace(/ou/g,"u").replace(/mp/g,"b").replace(/nt/g,"d").replace(/ph/g,"f").replace(/ch/g,"h").replace(/gg/g,"ng").replace(/gk/g,"g").replace(/y/g,"i").replace(/w/g,"o").replace(/ai/g,"e").replace(/[eo]i/g,"i").replace(/([a-z])\1/g,"$1")};
/* name search, one spelling for Greek, greeklish and typos: letters that sound alike collapse, then each typed word may be a few edits away */
const SK={α:"a",β:"v",γ:"g",δ:"d",ε:"e",ζ:"z",η:"i",θ:"8",ι:"i",κ:"k",λ:"l",μ:"m",ν:"n",ξ:"x",ο:"o",π:"p",ρ:"r",σ:"s",ς:"s",τ:"t",υ:"i",φ:"f",χ:"x",ψ:"4",ω:"o"};
const sk=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/ου/g,"u").replace(/ευ/g,"ev").replace(/αυ/g,"av").replace(/γγ/g,"ng").replace(/γκ/g,"g").replace(/μπ/g,"b").replace(/ντ/g,"d").replace(/[α-ως]/g,c=>SK[c]||c).replace(/ph/g,"f").replace(/th/g,"8").replace(/ch/g,"x").replace(/kh(?=[aeiouwyrl])/g,"x").replace(/dh(?=[aeiouwy])/g,"d").replace(/gh(?=[aeiouwy])/g,"g").replace(/ps/g,"4").replace(/ks/g,"x").replace(/3/g,"x").replace(/h(?![aeiouwy])/g,"i").replace(/h/g,"x").replace(/c/g,"k").replace(/q/g,"k").replace(/y/g,"i").replace(/w/g,"o").replace(/ou/g,"u").replace(/mp/g,"b").replace(/nt/g,"d").replace(/gg/g,"ng").replace(/gk/g,"g").replace(/b/g,"v").replace(/ai/g,"e").replace(/[eo]i/g,"i").replace(/([a-z])\1/g,"$1");
const NICK=(()=>{const m={};["Γιώργος Γεώργιος Γιωργής","Γεωργία Γιωργία","Βαγγέλης Ευάγγελος","Ευαγγελία Λίτσα","Κώστας Κωστής Κωνσταντίνος Ντίνος","Κωνσταντίνα Ντίνα Ναντίνα","Θάνος Αθανάσιος Σάκης","Αθανασία Νάνσυ Νάσια","Τάσος Αναστάσιος","Αναστασία Τασία Νατάσα Νατάσσα","Νίκος Νικόλαος","Νίκη Νικολέτα","Στέλλα Στυλιανή","Δημήτρης Δημήτριος Μήτσος","Δήμητρα Μίνα","Γιάννης Ιωάννης","Ιωάννα Γιάννα","Μιχάλης Μιχαήλ","Παναγιώτης Πάνος","Θοδωρής Θεόδωρος","Χάρης Χαράλαμπος Μπάμπης","Φώτης Φώτιος","Βασίλης Βασίλειος","Βασιλική Βίκυ Βάσω","Αλέξανδρος Αλέκος Αλέξης","Ελένη Έλενα Λένα","Κατερίνα Αικατερίνη","Μαρία Μαρίκα","Παρασκευή Βούλα Εύη","Ειρήνη Ρένα","Αγγελική Άντζελα","Φωτεινή Φαίη","Σπύρος Σπυρίδων","Λευτέρης Ελευθέριος","Ελευθερία Ρία","Αριστείδης Άρης","Στέφανος Στέφος"].forEach(g=>{const w=g.split(" ").map(n=>sk(n));w.forEach(n=>m[n]=w[0])});return m})();
/* the same letters one by one, without joining ου, ντ, αι and the like: a typo can break those pairs, as in Ασωντου for Ασωνίτου or Μραία for Μαρία */
const skFlat=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/ου/g,"ou").replace(/[α-ως]/g,c=>SK[c]||c).replace(/ph/g,"f").replace(/th/g,"8").replace(/ch/g,"x").replace(/ps/g,"4").replace(/ks/g,"x").replace(/3/g,"x").replace(/c/g,"k").replace(/q/g,"k").replace(/y/g,"i").replace(/w/g,"o").replace(/h/g,"i").replace(/b/g,"v").replace(/([a-z])\1/g,"$1");
/* the letters of a word as a set, in any order, so a scrambled name still counts: Κοφνιής, Φικονής */
const skLetters=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[α-ως]/g,c=>SK[c]||c).replace(/y/g,"i").replace(/w/g,"o");
function skBag(a,b){if(Math.abs(a.length-b.length)>2)return 9;const c={};for(const x of a)c[x]=(c[x]||0)+1;for(const x of b)c[x]=(c[x]||0)-1;let p=0,n=0;Object.values(c).forEach(v=>{if(v>0)p+=v;else n-=v});return Math.max(p,n)}
const skWords=s=>{const a=sk(s).split(/[^a-z0-9]+/).filter(Boolean);a.f=skFlat(s).split(/[^a-z0-9]+/).filter(Boolean);a.b=skLetters(s).split(/[^a-z0-9]+/).filter(Boolean);return a};
function skDist(a,b){if(Math.abs(a.length-b.length)>3)return 9;let p2=null,p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++){let v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));if(p2&&i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,p2[j-2]+1);c[j]=v}p2=p;p=c}return p[b.length]}
const skOk=w=>w.length<3?0:w.length<6?1:w.length<9?2:3;
/* how far one typed word is from one word of a name: whole word or everyday form 0, start of a word 1, inside a word 2, typos 3 and up; null when it is too far */
function skWord(w,h){if(w===h||(NICK[w]&&NICK[w]===NICK[h]))return 0;if(h.startsWith(w))return 1;if(w.length>=3&&h.includes(w))return 2;const d=Math.min(skDist(w,h),NICK[w]?skDist(NICK[w],h):9,NICK[h]?skDist(w,NICK[h]):9);if(d<=skOk(w))return 2+d;if(w.length>=4&&h.length>w.length){const d2=skDist(w,h.slice(0,w.length));if(d2<=skOk(w)-(w.length<6?0:1))return 3+d2}return null}
/* score of a typed search against a name: lower is better, null when no word fits; `all` when every typed word fits */
function skScore(q,name){const qs=q.split?skWords(q):q,ws=name.split?skWords(name):name;if(!qs.length||!ws.length)return null;let sum=0,hits=0;const qf=qs.f&&qs.f.length===qs.length?qs.f:null;qs.forEach((w,i)=>{let best=null;ws.forEach(h=>{const v=skWord(w,h);if(v!==null&&(best===null||v<best))best=v});if(best===null&&qf&&ws.f&&qf[i].length>=4){const lim=qf[i].length<7?1:2;ws.f.forEach(h=>{const d=skDist(qf[i],h);if(d<=lim&&(best===null||3+d<best))best=3+d})}if(best===null&&qs.b&&ws.b&&qs.b.length===qs.length&&qs.b[i].length>=3){const q=qs.b[i],lim=q.length<4?0:q.length<8?1:2;ws.b.forEach(h=>{if(h.length<3)return;const d=skBag(q,h);if(d<=lim&&(best===null||3+d<best))best=3+d})}if(best===null)sum+=4+Math.min(4,...ws.map(h=>skDist(w,h)));else{hits++;sum+=best}});if(qs.length===1&&qs[0].length>=7&&!hits&&ws.length>1){let d=Math.min(skDist(qs[0],ws.join("")),skDist(qs[0],ws.slice().reverse().join("")));ws.forEach((x,a)=>ws.forEach((y,b)=>{if(a!==b)d=Math.min(d,skDist(qs[0],x+y))}));if(d<=skOk(qs[0]))return{sum:3+d,hits:1,all:true}}return hits?{sum,hits,all:hits===qs.length}:null}
/* the people this search could mean: everyone matching all typed words, or failing that the best partial matches */
function skFind(q,list,nameOf,limit){const qs=skWords(q),sc=[];list.forEach(p=>{const s=skScore(qs,nameOf(p));if(s)sc.push({p,s})});const all=sc.filter(x=>x.s.all),use=all.length?all:qs.length>1?sc:[];return use.sort((a,b)=>a.s.sum-b.s.sum||b.s.hits-a.s.hits).slice(0,limit).map(x=>x.p)}
const REL={no:"Όχι μαζί",must:"Μαζί υποχρεωτικά",first:"1η επιλογή",second:"2η επιλογή"},CREW=30;
let code="",D={people:[],rel:[],tables:[],issues:[]},sel=null,relKind=null;
let queue=Promise.resolve();const post=b=>{const run=()=>fetch(API,{method:"POST",body:JSON.stringify(Object.assign({plan:code},b))}).then(r=>r.json());const p=queue.then(run,run);queue=p.catch(()=>{});return p};
const say=(m,ms)=>{const e=$("#msg");e.textContent=m;e.hidden=!m;clearTimeout(say.t);if(m&&ms)say.t=setTimeout(()=>{e.hidden=true},ms||3000)};
const P=n=>D.people.find(p=>p.name===n),at=t=>D.people.filter(p=>String(p.table)===String(t)),capOf=t=>(D.tables.find(x=>+x.t===+t)||{}).cap||12,company=n=>{const p=P(n);return p?D.people.filter(o=>o.owner===p.owner):[]};
/* the same rules as the sheet, computed locally so every warning shows before anything changes */
function issues(){const o=[],T={};D.people.forEach(p=>{if(p.table)T[p.table]=(T[p.table]||0)+1});D.tables.forEach(t=>{if(+t.t!==CREW&&(T[t.t]||0)>t.cap)o.push({level:"error",text:`Τραπέζι ${t.t}: ${T[t.t]} άτομα, χωράει ${t.cap}`,who:[],t:t.t})});
  D.rel.forEach(r=>{const a=(P(r.a)||{}).table,b=(P(r.b)||{}).table;if(!a||!b)return;if(r.k===REL.no&&String(a)===String(b))o.push({level:"error",text:`${r.a} και ${r.b} δεν μιλάνε, αλλά κάθονται στο τραπέζι ${a}`,who:[r.a,r.b],t:a});if(r.k===REL.must&&String(a)!==String(b))o.push({level:"error",text:`${r.a} και ${r.b} πρέπει να είναι μαζί, αλλά είναι στα τραπέζια ${a} και ${b}`,who:[r.a,r.b]})});
  D.people.filter(p=>p.owner!==p.name&&p.table&&(P(p.owner)||{}).table&&String(p.table)!==String(P(p.owner).table)).forEach(p=>o.push({level:"warn",text:`${p.name} (τραπέζι ${p.table}) κάθεται χωριστά από ${p.owner} (τραπέζι ${P(p.owner).table})`,who:[p.name,p.owner]}));
  D.people.filter(p=>!p.anon&&p.table).forEach(p=>{const pr=k=>D.rel.filter(r=>r.k===k&&r.a===p.name).map(r=>r.b),f=pr(REL.first),s=pr(REL.second);if(!f.length&&!s.length)return;const h=l=>l.some(n=>String((P(n)||{}).table)===String(p.table));if(h(f))return;if(h(s)){if(f.length)o.push({level:"info",text:`${p.name}: πήρε τη 2η επιλογή (${s.join(", ")}), όχι την 1η (${f.join(", ")})`,who:[p.name]});return}o.push({level:"warn",text:`${p.name}: δεν κάθεται με καμία επιλογή του/της (${f.concat(s).join(", ")})`,who:[p.name]})});
  const u=D.people.filter(p=>!p.table).length;if(u)o.push({level:"info",text:`${u} άτομα δεν έχουν ακόμα τραπέζι`,who:[]});return o.sort((a,b)=>"ewi".indexOf(a.level[0])-"ewi".indexOf(b.level[0]))}
/* what would happen if these people went to table t */
function preview(names,t){const stay=at(t).filter(p=>!names.includes(p.name)),e=[],w=[],inf=[],after=stay.length+names.length,cap=capOf(t);if(+t!==CREW&&after>cap)e.push(`Δεν χωράνε: στο τραπέζι ${t} θα γίνουν ${after} άτομα, ενώ χωράει ${cap}.`);
  names.forEach(n=>{stay.forEach(o=>{D.rel.filter(r=>r.k===REL.no&&((r.a===n&&r.b===o.name)||(r.b===n&&r.a===o.name))).forEach(()=>e.push(`${n} δεν μιλάει με ${o.name}, που κάθεται σε αυτό το τραπέζι.`))});D.rel.filter(r=>r.k===REL.must&&(r.a===n||r.b===n)).forEach(r=>{const x=r.a===n?r.b:r.a;if(!names.includes(x)&&String((P(x)||{}).table)!==String(t))e.push(`${n} πρέπει να είναι μαζί με ${x}, που μένει στο τραπέζι ${(P(x)||{}).table||"–"}.`)});
    const pr=k=>D.rel.filter(r=>r.k===k&&r.a===n).map(r=>r.b),f=pr(REL.first),s=pr(REL.second),here=l=>l.filter(x=>names.includes(x)||stay.some(o=>o.name===x));if(f.length||s.length){if(here(f).length)inf.push(`${n}: θα κάθεται με την 1η επιλογή (${here(f).join(", ")}).`);else if(here(s).length)inf.push(`${n}: θα κάθεται με τη 2η επιλογή (${here(s).join(", ")}).`);else w.push(`${n}: δεν θα κάθεται με καμία επιλογή του/της (${f.concat(s).join(", ")}).`)}
    D.rel.filter(r=>(r.k===REL.first||r.k===REL.second)&&r.b===n&&!names.includes(r.a)&&String((P(r.a)||{}).table)===String((P(n)||{}).table)).forEach(r=>w.push(`${r.a} ήθελε να κάθεται με ${n} (${r.k}) και θα μείνει πίσω.`))});
  names.forEach(n=>company(n).filter(o=>!names.includes(o.name)&&String(o.table)!==String(t)).forEach(o=>{const m=`${n} θα κάθεται χωριστά από ${o.name}.`;if(!w.includes(m))w.push(m)}));return{e:[...new Set(e)],w:[...new Set(w)],inf:[...new Set(inf)],after,cap}}
const dlg=html=>{$("#box").innerHTML=html;$("#dlg").hidden=false},close=()=>{$("#dlg").hidden=true};
function askMove(n,t,i){const co=company(n).filter(o=>o.name!==n&&String(o.table)===String(P(n).table));if(co.length){dlg(`<h2>Να πάει και η παρέα;</h2><p>${esc(n)} έχει μαζί: <b>${esc(co.map(o=>o.name).join(", "))}</b>.</p><div class="acts"><button class="main" id="dA">Όλοι μαζί στο τραπέζι ${t}</button><button id="dB">Μόνο ${esc(n)}</button><button id="dX">Άκυρο</button></div>`);$("#dA").onclick=()=>confirmMove([n,...co.map(o=>o.name)],t,i);$("#dB").onclick=()=>confirmMove([n],t,i);$("#dX").onclick=close;return}confirmMove([n],t,i)}

$("#bC").onclick=()=>{dlg('<h2>Άδειασμα πρόχειρου</h2><p>Θα φύγουν όλοι από τα τραπέζια. Οι σχέσεις μένουν και οι καλεσμένοι δεν βλέπουν το πρόχειρο.</p><div class="acts"><button class="bad" id="dO">Άδειασε</button><button id="dX">Άκυρο</button></div>');$("#dO").onclick=()=>{close();say("Αποθήκευση…");post({action:"clear"}).then(d=>{load2(d);say("Το πρόχειρο άδειασε",2500)})};$("#dX").onclick=close};
const enter=v=>{code=v;$("#le").hidden=true;return load().then(()=>{try{sessionStorage.setItem("plan",v)}catch(e){}$("#login").hidden=true;$("#app").hidden=false})};
$("#lf").addEventListener("submit",e=>{e.preventDefault();enter($("#code").value.trim()).catch(()=>{$("#le").hidden=false})});
try{const c=location.hash.slice(1)||sessionStorage.getItem("plan");if(c)enter(c).catch(()=>{})}catch(e){}
</script></body></html>
