<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Πλάνο τραπεζιών</title>

<style>:root{--g:#36463a;--d:#27332a;--k:#b38444;--t:#e6dfae;--p:#d6ce9b;--r:#d9574a;--y:#d9a83f}*{box-sizing:border-box}body{margin:0;background:var(--g);color:var(--t);font:400 15px Commissioner,system-ui,sans-serif;border-top:8px solid var(--k);min-height:100vh}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}.card{background:rgba(255,255,255,.06);border-radius:6px;padding:4px;cursor:pointer;border:2px solid transparent}.card.tgt{border-color:var(--k)}.card.err{background:rgba(217,87,74,.3)}.card.ok{border-color:#7fb77e}svg{display:block;width:100%;height:auto}svg text{fill:var(--t);font:11px Commissioner,sans-serif}.seat{cursor:pointer}.grid.one{grid-template-columns:1fr}.map{background:#26362b;border-radius:6px}g.card{cursor:pointer}g.card .tb{fill:#efe9cf;stroke:#b38444;stroke-width:1.2}g.card.full .tb{fill:#d6ce9b}g.card.empty .tb{fill:#3b4b3f}g.card.empty text{fill:var(--t)!important}g.card.mine .tb{fill:#e8c469;stroke:#fff;stroke-width:2}g.card.zoom .tb{stroke:#fff;stroke-width:2}g.card.err .tb{fill:#d9574a}g.card.tgt .tb{stroke:#7fb77e;stroke-width:2.2}g.card.add .tb{stroke-dasharray:3 2}
.sug{background:#fff;color:#222;border-radius:0 0 4px 4px;max-height:280px;overflow:auto}.sug button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eee;color:#222;border-radius:0}.sug small{color:#777;margin-left:6px}.who{font-size:18px;color:#f7f1c8;font-weight:600;margin:10px 0 2px}.muted{color:var(--p);font-size:13px}.rel{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(214,206,155,.2)}.rel button{min-height:32px;padding:0 9px}.k{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.iss{padding:7px 9px;border-radius:4px;margin-top:5px;font-size:14px;line-height:1.35;cursor:pointer}.iss.error{background:rgba(217,87,74,.4)}.iss.warn{background:rgba(217,168,63,.28)}.iss.info{background:rgba(255,255,255,.08)}
#dlg{position:fixed;inset:0;background:rgba(10,16,12,.72);display:grid;place-items:center;padding:16px;z-index:9}#dlg[hidden]{display:none}#box{background:var(--d);border:1px solid var(--k);border-radius:8px;padding:18px;max-width:480px;width:100%;max-height:90vh;overflow:auto}#box .acts{display:grid;gap:8px;margin-top:14px}#msg{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--k);color:#1c241d;padding:9px 14px;border-radius:4px;font-weight:500;z-index:8;max-width:90vw}.err{color:#ffb4a8;margin-top:8px}</style></head><body><main>
<h1>Πλάνο τραπεζιών</h1><div id="login"><form id="lf"><input id="code" type="password" inputmode="numeric" autocomplete="off" aria-label="Κωδικός" placeholder="Κωδικός"><p class="err" id="le" hidden>Λάθος κωδικός.</p></form></div>
<div id="app" hidden><div class="top"><button id="bP" type="button" class="main">Πρότεινε για όσους δεν έχουν τραπέζι</button><button id="bV" type="button">Κάρτες</button><button id="bR" type="button">Στην τύχη (δοκιμή)</button><button id="bC" type="button">Άδειασε το πρόχειρο</button><button id="bU" type="button" disabled>↶ Αναίρεση</button></div>
<div class="lay"><div class="grid" id="grid"></div><aside id="side"><input id="q" placeholder="Γράψε όνομα…" autocomplete="off" aria-label="Αναζήτηση ονόματος"><div class="sug" id="sug"></div><div id="det"></div><h2>Προβλήματα</h2><div id="iss"></div></aside></div></div></main>
<div id="dlg" hidden><div id="box" role="dialog" aria-modal="true"></div></div><div id="msg" hidden></div>
<script>
const API="https://script.google.com/macros/s/AKfycbyXsQxEqpwThf_YAv5o1yZVHXoVl8OiKRJQw1J4kpEOkjMKFUAl4oHK2LMycmeP4wcG3w/exec",$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GR={α:"a",β:"v",γ:"g",δ:"d",ε:"e",ζ:"z",η:"i",θ:"th",ι:"i",κ:"k",λ:"l",μ:"m",ν:"n",ξ:"ks",ο:"o",π:"p",ρ:"r",σ:"s",ς:"s",τ:"t",υ:"i",φ:"f",χ:"h",ψ:"ps",ω:"o"};
const norm=s=>{let t=String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/ου/g,"u").replace(/ευ/g,"ev").replace(/αυ/g,"av").replace(/γγ/g,"ng").replace(/γκ/g,"g").replace(/μπ/g,"b").replace(/ντ/g,"d").replace(/x/g,"h");return t.replace(/[α-ως]/g,c=>GR[c]||c).replace(/ou/g,"u").replace(/mp/g,"b").replace(/nt/g,"d").replace(/ph/g,"f").replace(/ch/g,"h").replace(/gg/g,"ng").replace(/gk/g,"g").replace(/y/g,"i").replace(/w/g,"o").replace(/ai/g,"e").replace(/[eo]i/g,"i").replace(/([a-z])\1/g,"$1")};
const REL={no:"Όχι μαζί",must:"Μαζί υποχρεωτικά",first:"1η επιλογή",second:"2η επιλογή"},CREW=30;
let code="",D={people:[],rel:[],tables:[],issues:[]},sel=null,relKind=null;
let queue=Promise.resolve();const post=b=>{const run=()=>fetch(API,{method:"POST",body:JSON.stringify(Object.assign({plan:code},b))}).then(r=>r.json());const p=queue.then(run,run);queue=p.catch(()=>{});return p};
const say=(m,ms)=>{const e=$("#msg");e.textContent=m;e.hidden=!m;clearTimeout(say.t);if(m&&ms)say.t=setTimeout(()=>{e.hidden=true},ms||3000)};
const P=n=>D.people.find(p=>p.name===n),at=t=>D.people.filter(p=>String(p.table)===String(t)),capOf=t=>(D.tables.find(x=>+x.t===+t)||{}).cap||12,company=n=>{const p=P(n);return p?D.people.filter(o=>o.owner===p.owner):[]};
/* the same rules as the sheet, computed locally so every warning shows before anything changes */
function issues(){const o=[],T={};D.people.forEach(p=>{if(p.table)T[p.table]=(T[p.table]||0)+1});D.tables.forEach(t=>{if(+t.t!==CREW&&(T[t.t]||0)>t.cap)o.push({level:"error",text:`Τραπέζι ${t.t}: ${T[t.t]} άτομα, χωράει ${t.cap}`,who:[],t:t.t})});
  D.rel.forEach(r=>{const a=(P(r.a)||{}).table,b=(P(r.b)||{}).table;if(!a||!b)return;if(r.k===REL.no&&String(a)===String(b))o.push({level:"error",text:`${r.a} και ${r.b} δεν μιλάνε, αλλά κάθονται στο τραπέζι ${a}`,who:[r.a,r.b],t:a});if(r.k===REL.must&&String(a)!==String(b))o.push({level:"error",text:`${r.a} και ${r.b} πρέπει να είναι μαζί, αλλά είναι στα τραπέζια ${a} και ${b}`,who:[r.a,r.b]})});
  D.people.filter(p=>p.owner!==p.name&&p.table&&(P(p.owner)||{}).table&&String(p.table)!==String(P(p.owner).table)).forEach(p=>o.push({level:"warn",text:`${p.name} (τραπέζι ${p.table}) κάθεται χωριστά από ${p.owner} (τραπέζι ${P(p.owner).table})`,who:[p.name,p.owner]}));
  D.people.filter(p=>!p.anon&&p.table).forEach(p=>{const pr=k=>D.rel.filter(r=>r.k===k&&r.a===p.name).map(r=>r.b),f=pr(REL.first),s=pr(REL.second);if(!f.length&&!s.length)return;const h=l=>l.some(n=>String((P(n)||{}).table)===String(p.table));if(h(f))return;if(h(s)){if(f.length)o.push({level:"info",text:`${p.name}: πήρε τη 2η επιλογή (${s.join(", ")}), όχι την 1η (${f.join(", ")})`,who:[p.name]});return}o.push({level:"warn",text:`${p.name}: δεν κάθεται με καμία επιλογή του/της (${f.concat(s).join(", ")})`,who:[p.name]})});
  const u=D.people.filter(p=>!p.table).length;if(u)o.push({level:"info",text:`${u} άτομα δεν έχουν ακόμα τραπέζι`,who:[]});return o.sort((a,b)=>"ewi".indexOf(a.level[0])-"ewi".indexOf(b.level[0]))}
/* what would happen if these people went to table t */
function preview(names,t){const stay=at(t).filter(p=>!names.includes(p.name)),e=[],w=[],inf=[],after=stay.length+names.length,cap=capOf(t);if(+t!==CREW&&after>cap)e.push(`Δεν χωράνε: στο τραπέζι ${t} θα γίνουν ${after} άτομα, ενώ χωράει ${cap}.`);
  names.forEach(n=>{stay.forEach(o=>{D.rel.filter(r=>r.k===REL.no&&((r.a===n&&r.b===o.name)||(r.b===n&&r.a===o.name))).forEach(()=>e.push(`${n} δεν μιλάει με ${o.name}, που κάθεται σε αυτό το τραπέζι.`))});D.rel.filter(r=>r.k===REL.must&&(r.a===n||r.b===n)).forEach(r=>{const x=r.a===n?r.b:r.a;if(!names.includes(x)&&String((P(x)||{}).table)!==String(t))e.push(`${n} πρέπει να είναι μαζί με ${x}, που μένει στο τραπέζι ${(P(x)||{}).table||"–"}.`)});
    const pr=k=>D.rel.filter(r=>r.k===k&&r.a===n).map(r=>r.b),f=pr(REL.first),s=pr(REL.second),here=l=>l.filter(x=>names.includes(x)||stay.some(o=>o.name===x));if(f.length||s.length){if(here(f).length)inf.push(`${n}: θα κάθεται με την 1η επιλογή (${here(f).join(", ")}).`);else if(here(s).length)inf.push(`${n}: θα κάθεται με τη 2η επιλογή (${here(s).join(", ")}).`);else w.push(`${n}: δεν θα κάθεται με καμία επιλογή του/της (${f.concat(s).join(", ")}).`)}
    D.rel.filter(r=>(r.k===REL.first||r.k===REL.second)&&r.b===n&&!names.includes(r.a)&&String((P(r.a)||{}).table)===String((P(n)||{}).table)).forEach(r=>w.push(`${r.a} ήθελε να κάθεται με ${n} (${r.k}) και θα μείνει πίσω.`))});
  names.forEach(n=>company(n).filter(o=>!names.includes(o.name)&&String(o.table)!==String(t)).forEach(o=>{const m=`${n} θα κάθεται χωριστά από ${o.name}.`;if(!w.includes(m))w.push(m)}));return{e:[...new Set(e)],w:[...new Set(w)],inf:[...new Set(inf)],after,cap}}
const dlg=html=>{$("#box").innerHTML=html;$("#dlg").hidden=false},close=()=>{$("#dlg").hidden=true};
function askMove(n,t,i){const co=company(n).filter(o=>o.name!==n&&String(o.table)===String(P(n).table));if(co.length){dlg(`<h2>Να πάει και η παρέα;</h2><p>${esc(n)} έχει μαζί: <b>${esc(co.map(o=>o.name).join(", "))}</b>.</p><div class="acts"><button class="main" id="dA">Όλοι μαζί στο τραπέζι ${t}</button><button id="dB">Μόνο ${esc(n)}</button><button id="dX">Άκυρο</button></div>`);$("#dA").onclick=()=>confirmMove([n,...co.map(o=>o.name)],t,i);$("#dB").onclick=()=>confirmMove([n],t,i);$("#dX").onclick=close;return}confirmMove([n],t,i)}
function confirmMove(names,t,i){const r=preview(names,t),list=(a,c)=>a.map(x=>`<div class="iss ${c}">${esc(x)}</div>`).join("");if(!r.e.length&&!r.w.length){close();doMove(names,t,i);if(r.inf.length)say(r.inf[0],4000);return}
  dlg(`<h2>${r.e.length?"Υπάρχει πρόβλημα":"Πρόσεξε"}</h2><p>${esc(names.join(", "))} → τραπέζι ${t} (${r.after}/${r.cap})</p>${list(r.e,"error")}${list(r.w,"warn")}${list(r.inf,"info")}<div class="acts"><button class="${r.e.length?"bad":"main"}" id="dO">${r.e.length?"Μετακίνηση παρ' όλα αυτά":"Μετακίνηση"}</button><button id="dX">Άκυρο</button></div>`);$("#dO").onclick=()=>{close();doMove(names,t,i)};$("#dX").onclick=close}
function doMove(names,t,i){if(i!=null){const a=layout(t).map(p=>p&&names.includes(p.name)?null:p),ppl=names.map(P).filter(Boolean);let k=i;ppl.forEach(p=>{let g=0;while(a[k%a.length]&&g++<a.length)k++;a[k%a.length]=p});sel&&(sel.move=false);saveSeats(freeze(t,a),`${names[0]}${names.length>1?" και "+(names.length-1)+" ακόμα":""} → τραπέζι ${t}, θέση ${i+1}`);return}names.forEach(n=>{const p=P(n);if(p){p.table=t;p.seat=0}});if(sel&&names.includes(sel.n))sel.move=false;sel&&(sel.move=false);draw();say("Αποθήκευση…");post({action:"move",names,t}).then(d=>{if(d.undo)D.undo=d.undo;drawUndo();say(d.ok?"Αποθηκεύτηκε":"Δεν αποθηκεύτηκε",2000)}).catch(()=>say("Δεν αποθηκεύτηκε, δοκίμασε ξανά",4000))}
/* who sits where: chosen seats first, everyone else on the free ones in list order */
function layout(t){const L=at(t),n=Math.max(capOf(t),L.length,1),a=Array(n).fill(null),rest=[];L.forEach(p=>{const i=(+p.seat||0)-1;if(i>=0&&i<n&&!a[i])a[i]=p;else rest.push(p)});let k=0;rest.forEach(p=>{while(a[k])k++;a[k]=p});return a}
function saveSeats(list,label){draw();say("Αποθήκευση…");post({action:"seats",list,label}).then(d=>{if(d.undo)D.undo=d.undo;drawUndo();say(d.ok?"Αποθηκεύτηκε":"Δεν αποθηκεύτηκε",2000)}).catch(()=>say("Δεν αποθηκεύτηκε, δοκίμασε ξανά",4000))}
const freeze=(t,a)=>a.map((p,i)=>{if(!p)return null;p.table=t;p.seat=i+1;return[p.name,t,i+1]}).filter(Boolean);
/* tapping a seat while moving someone: an empty seat takes them, a taken one swaps the two */
function seatTo(n,t,i){const me=P(n),a=layout(t),o=a[i];if(o&&o.name===n){sel.move=false;draw();return}
  if(String(me.table)===String(t)){const j=a.indexOf(me);a[j]=o;a[i]=me;close();sel.move=false;saveSeats(freeze(t,a),`${n}: θέση ${i+1}`);return}
  if(o){const r=preview([n],t),e=r.e.filter(x=>!x.startsWith("Δεν χωράνε")),old=me.table;dlg(`<h2>Η θέση είναι πιασμένη</h2><p>Κάθεται ${esc(o.name)}. Να αλλάξουν θέση με ${esc(n)};</p>${[...e.map(x=>`<div class="iss error">${esc(x)}</div>`),...r.w.map(x=>`<div class="iss warn">${esc(x)}</div>`)].join("")}<div class="acts"><button class="${e.length?"bad":"main"}" id="dO">Αλλαγή θέσης</button><button id="dX">Άκυρο</button></div>`);$("#dO").onclick=()=>{close();const b=old?layout(old):null,j=b?b.indexOf(me):-1;a[i]=me;let list=freeze(t,a);if(b){b[j]=o;list=list.concat(freeze(old,b))}else{o.table="";o.seat=0;list.push([o.name,"",""])}sel.move=false;saveSeats(list,`${n} ↔ ${o.name}`)};$("#dX").onclick=close;return}
  askMove(n,t,i)}
/* the floor plan, traced from the aerial photo of the estate (not measured): pool on the left, dance floor, the long table before the wall of lights, round tables above and below. Dashed tables are the ones added beyond the photo */
const MAP={1:[384,260],2:[368,464],3:[417,451],4:[440,262,1],5:[326,268],6:[316,464],7:[369,208],8:[377,518],9:[428,205,1],10:[432,517],11:[320,210],12:[320,518],13:[272,268],14:[266,460],15:[266,208],16:[267,518],17:[435,140],18:[406,571],19:[390,150],20:[348,576],21:[338,146],22:[292,578],23:[282,150],30:[432,62]};
let view="map",zoomT=null;
function floorMap(IS,m){const T=t=>D.tables.find(x=>+x.t===+t),lab=(x,y,txt,sz,c)=>`<text x="${x}" y="${y}" text-anchor="middle" style="font-size:${sz||7}px;fill:${c||"#e6dfae"}">${esc(txt)}</text>`;
  const tb=Object.keys(MAP).map(k=>{const t=T(k);if(!t)return"";const [x,y,add]=MAP[k],L=at(k),bad=IS.some(i=>i.level==="error"&&(String(i.t)===String(k)||i.who.some(w=>String((P(w)||{}).table)===String(k))));let cls=(bad?"err ":"")+(L.length?L.length>=t.cap?"full ":"":"empty ")+(add?"add ":"")+(zoomT===+k?"zoom ":"")+(sel&&String((P(sel.n)||{}).table)===String(k)?"mine ":"");if(m&&sel)cls+=preview([sel.n],k).e.length?"err tgt":"ok tgt";const n=t.cap,dots=Array.from({length:n},(_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return`<circle cx="${x+Math.cos(a)*22}" cy="${y+Math.sin(a)*22}" r="2.1" fill="${i<L.length?"#e6dfae":"none"}" stroke="#b38444" stroke-width=".6"/>`}).join("");
    return`<g class="card ${cls}" data-t="${k}"><title>Τραπέζι ${k}${t.name?" · "+esc(t.name):""}: ${L.length}/${n}${L.length?"\n"+esc(L.map(p=>p.name).join(", ")):""}</title><circle class="tb" cx="${x}" cy="${y}" r="17"/>${dots}<text x="${x}" y="${y-1}" text-anchor="middle" style="font:600 12px Commissioner,sans-serif;fill:#27332a">${k}</text><text x="${x}" y="${y+8}" text-anchor="middle" style="font-size:6.5px;fill:#27332a">${L.length}/${n}</text>${t.name?lab(x,y+31,t.name.length>20?t.name.slice(0,19)+"…":t.name,5.6):""}</g>`}).join("");
  return`<svg class="map" viewBox="125 30 385 580" role="img" aria-label="Κάτοψη του κτήματος με τα τραπέζια">
<rect x="150" y="185" width="80" height="170" fill="#1f6f6a" stroke="#6b5a48" stroke-width="3"/><rect x="150" y="378" width="80" height="152" fill="#1f6f6a" stroke="#6b5a48" stroke-width="3"/><rect x="144" y="355" width="92" height="23" fill="#5a3f2c"/>${lab(190,270,"Πισίνα",9,"#bfe3df")}${lab(190,370,"γέφυρα",6,"#e6dfae")}${lab(190,455,"Πισίνα",9,"#bfe3df")}
<rect x="236" y="295" width="134" height="135" fill="#8a5f3d" stroke="#b38444"/>${lab(303,366,"Πίστα",11,"#f7f1c8")}
<circle cx="408" cy="365" r="16" fill="#f4efe0" stroke="#b38444"/>${lab(408,368,"Τούρτα",6.5,"#27332a")}
<rect x="440" y="302" width="30" height="126" rx="3" fill="#f4efe0" stroke="#b38444"/><text transform="translate(458,365) rotate(-90)" text-anchor="middle" style="font-size:7.5px;fill:#27332a">Μακρύ τραπέζι</text>
<rect x="481" y="295" width="7" height="140" fill="#e8c469" opacity=".85"/><text transform="translate(499,365) rotate(-90)" text-anchor="middle" style="font-size:6.5px;fill:#e8c469">τοίχος με φωτάκια</text>
${tb}</svg><p class="muted" style="margin:6px 2px">Το σχέδιο είναι από την αεροφωτογραφία, όχι μετρημένο. Με διακεκομμένη γραμμή τα 2 τραπέζια που πρόσθεσα. Πάτα ένα τραπέζι για να δεις τις θέσεις του.</p>`}
function drawGrid(){const m=sel&&sel.move,used=D.tables.filter(t=>at(t.t).length||+t.t===CREW),last=Math.max(0,...used.filter(t=>+t.t!==CREW).map(t=>+t.t)),show=D.tables.filter(t=>+t.t<=last+1||+t.t===CREW),IS=issues();
  const onMap=view==="map",rest=onMap?show.filter(t=>!MAP[t.t]&&at(t.t).length):show;$("#grid").classList.toggle("one",onMap);
  $("#grid").innerHTML=(onMap?floorMap(IS,m):"")+(onMap&&zoomT&&D.tables.find(x=>+x.t===zoomT)?[D.tables.find(x=>+x.t===zoomT)]:[]).concat(rest).map(t=>{const L=at(t.t),lay=layout(t.t),n=lay.length,c=145,R=56,bad=IS.some(i=>i.level==="error"&&(String(i.t)===String(t.t)||i.who.some(x=>String((P(x)||{}).table)===String(t.t))));let cls=bad?"err":"";if(m&&sel){const pv=preview([sel.n],t.t);cls=pv.e.length?"err tgt":"ok tgt"}
    const seats=Array.from({length:n},(_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,x=c+Math.cos(a)*(R+13),y=c+Math.sin(a)*(R+13),lx=c+Math.cos(a)*(R+23),ly=c+Math.sin(a)*(R+23),p=lay[i],isSel=p&&sel&&sel.n===p.name,w=p?p.name.split(" (")[0].split(" "):[],lab=p?(p.anon?p.name.split(" ~")[0]:w.length>1?w[0]+" "+w[w.length-1][0]+".":w[0]):"",vert=Math.abs(Math.cos(a))<.2,anc=vert?"middle":Math.cos(a)>0?"start":"end",dy=vert?(Math.sin(a)>0?12:-12):0;return`<g class="seat" data-n="${p?esc(p.name):""}" data-i="${i}"><circle cx="${x}" cy="${y}" r="15" fill="transparent"/><circle cx="${x}" cy="${y}" r="8" fill="${isSel?"#e8c469":p?p.anon?"#a8a374":"#d6ce9b":"none"}" stroke="#d6ce9b"/>${p?`<text x="${lx}" y="${ly+4+dy}" text-anchor="${anc}">${esc(lab)}</text>`:""}</g>`}).join("");
    return`<div class="card ${cls}" data-t="${t.t}"><svg viewBox="-20 0 330 290" role="img" aria-label="Τραπέζι ${t.t}"><circle cx="${c}" cy="${c}" r="${R}" fill="#27332a" stroke="#b38444" stroke-width="3"/><text x="${c}" y="${c-4}" text-anchor="middle" style="font:400 26px 'GFS Didot',serif">${t.t}</text><text x="${c}" y="${c+15}" text-anchor="middle">${L.length} / ${t.cap}</text>${t.name?`<text x="${c}" y="${c+29}" text-anchor="middle">${esc(t.name.slice(0,18))}</text>`:""}${seats}</svg></div>`}).join("");
  $("#grid").querySelectorAll(".seat").forEach(s=>s.addEventListener("click",e=>{const n=s.dataset.n;if(sel&&sel.move){e.stopPropagation();seatTo(sel.n,+s.closest(".card").dataset.t,+s.dataset.i);return}if(!n)return;e.stopPropagation();pick(n)}));
  $("#grid").querySelectorAll(".card").forEach(k=>k.addEventListener("click",()=>{if(sel&&sel.move){const t=+k.dataset.t;if(String(P(sel.n).table)===String(t)){sel.move=false;draw();return}askMove(sel.n,t)}else if(!sel){const t=+k.dataset.t;if(k.tagName==="g"){zoomT=zoomT===t?null:t;draw()}else capDlg(t)}else if(k.tagName==="g"){zoomT=+k.dataset.t;draw()}}))}
function capDlg(t){const x=D.tables.find(y=>+y.t===t);dlg(`<h2>Τραπέζι ${t}</h2><p>Πόσα άτομα χωράει;</p><input id="cI" type="number" min="1" max="30" value="${x.cap}"><div class="acts"><button class="main" id="cO">Αποθήκευση</button><button id="dX">Άκυρο</button></div>`);$("#cO").onclick=()=>{x.cap=+$("#cI").value||x.cap;close();draw();post({action:"cap",t,cap:x.cap}).then(d=>{if(d.undo)D.undo=d.undo;drawUndo()}).catch(()=>say("Δεν αποθηκεύτηκε",3000))};$("#dX").onclick=close}
function pick(n){sel={n,move:false};relKind=null;$("#q").value="";$("#sug").innerHTML="";draw();$("#side").scrollTop=0}
function drawDet(){const e=$("#det");if(!sel){e.innerHTML='<p class="muted">Γράψε ένα όνομα ή πάτα κάποιον στα τραπέζια. Πάτα ένα τραπέζι για να αλλάξεις πόσα άτομα χωράει.</p>';return}const p=P(sel.n);if(!p){sel=null;e.innerHTML="";return}const co=company(sel.n).filter(o=>o.name!==p.name),rs=D.rel.filter(r=>r.a===p.name||r.b===p.name);
  e.innerHTML=`<div class="who">${esc(p.name)}</div><div class="muted">Τραπέζι ${p.table||"χωρίς"}${p.table?" · Θέση "+(layout(p.table).indexOf(p)+1):""}${p.group?" · "+esc(p.group):""}${co.length?" · Με: "+esc(co.map(o=>o.name).join(", ")):""}</div>${p.anon?"":`<label class="muted" style="display:block;margin-top:8px">Παρέα για το τραπέζι <select id="gS" style="width:100%;padding:8px;margin-top:4px">${[...new Set((D.groups||[]).concat(p.group?[p.group]:[]))].map(g=>`<option${g===String(p.group)?" selected":""}>${esc(g)}</option>`).join("")}</select></label>`}${p.anon?`<p class="muted">Θέση για άτομο χωρίς όνομα ακόμα, μαζί με ${esc(p.owner)}. Μόλις μάθεις το όνομα, γράψ' το στο seats, στήλη «Μαζί με», και κάθεται στο ίδιο τραπέζι.</p>`:""}<div class="k"><button class="main" id="mv">${sel.move?"Πάτα μια θέση ή ένα τραπέζι…":"Μετακίνηση"}</button><button id="off">Κλείσιμο</button></div>${rs.length?`<h2>Σχέσεις</h2>`+rs.map(r=>`<div class="rel"><span><b>${esc(r.k)}</b>: ${esc(r.a===p.name?r.b:r.a)}${r.a===p.name||r.k===REL.no||r.k===REL.must?"":" (τον/την διάλεξε)"}</span><button type="button" data-row="${r.row}">Αφαίρεση</button></div>`).join(""):""}${p.anon?"":`<h2>Νέα σχέση</h2><div class="k">${Object.values(REL).map(k=>`<button type="button" class="${relKind===k?"main":""}" data-k="${k}">${k}</button>`).join("")}</div>${relKind?`<input id="rq" style="margin-top:8px" placeholder="Με ποιον; Γράψε όνομα…" autocomplete="off"><div class="sug" id="rs"></div>`:""}`}`;
  const gS=$("#gS");if(gS)gS.onchange=()=>{say("Αποθήκευση…");post({action:"group",owner:p.owner,g:gS.value}).then(d=>{load2(d);say(d.ok?"Αποθηκεύτηκε":"Δεν αποθηκεύτηκε",2000)}).catch(()=>say("Δεν αποθηκεύτηκε",3000))};$("#mv").onclick=()=>{sel.move=!sel.move;draw()};$("#off").onclick=()=>{sel=null;draw()};e.querySelectorAll("[data-row]").forEach(b=>b.onclick=()=>{say("Αποθήκευση…");post({action:"unrel",row:+b.dataset.row}).then(d=>{load2(d);say("Αφαιρέθηκε",2000)})});e.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{relKind=b.dataset.k;drawDet();const i=$("#rq");if(i){i.focus();i.oninput=()=>sugg(i.value,$("#rs"),addRel)}})}
function addRel(o){const a=sel.n,k=relKind;relKind=null;const dup=D.rel.find(r=>r.k===k&&((r.a===a&&r.b===o)||(k!==REL.first&&k!==REL.second&&r.a===o&&r.b===a)));if(dup){say("Υπάρχει ήδη",2500);drawDet();return}const opp=D.rel.find(r=>((r.a===a&&r.b===o)||(r.a===o&&r.b===a))&&((k===REL.no&&r.k!==REL.no)||(k!==REL.no&&r.k===REL.no)));if(opp&&!confirm(`Υπάρχει ήδη: ${opp.a} / ${opp.b} = ${opp.k}. Να μπει και αυτό;`)){drawDet();return}say("Αποθήκευση…");post({action:"rel",a,b:o,k}).then(d=>{load2(d);const same=String((P(a)||{}).table)===String((P(o)||{}).table)&&(P(a)||{}).table;say(k===REL.no&&same?`ΠΡΟΣΟΧΗ: ${a} και ${o} κάθονται τώρα στο ίδιο τραπέζι.`:"Αποθηκεύτηκε",k===REL.no&&same?6000:2000)}).catch(()=>say("Δεν αποθηκεύτηκε",3000))}
function sugg(v,box,fn){const q=norm(v).split(/\s+/).filter(Boolean);if(!q.length){box.innerHTML="";return}const hit=D.people.filter(p=>!p.anon&&q.every(w=>norm(p.name).includes(w))&&!(sel&&p.name===sel.n)).slice(0,10);box.innerHTML=hit.length?hit.map(p=>`<button type="button" data-n="${esc(p.name)}">${esc(p.name)}<small>τραπέζι ${p.table||"–"}</small></button>`).join(""):'<p style="padding:8px;margin:0">Δεν βρέθηκε</p>';box.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{box.innerHTML="";fn(b.dataset.n)})}
function drawIss(){const I=issues();$("#iss").innerHTML=I.length?I.slice(0,40).map(i=>`<div class="iss ${i.level}" data-w="${esc(i.who[0]||"")}">${esc(i.text)}</div>`).join(""):'<p class="muted">Κανένα πρόβλημα.</p>';$("#iss").querySelectorAll("[data-w]").forEach(x=>x.onclick=()=>{if(x.dataset.w)pick(x.dataset.w)})}
let undoBusy=false;function drawUndo(){const u=D.undo||{n:0},b=$("#bU");b.disabled=!u.n||undoBusy;b.textContent=u.n?`↶ Αναίρεση (${u.n})`:"↶ Αναίρεση";b.title=u.label||""}
function undo(){if(undoBusy||!(D.undo&&D.undo.n))return;undoBusy=true;drawUndo();say("Αναίρεση…");post({action:"undo"}).then(d=>{undoBusy=false;sel=null;load2(d);drawUndo();say(d.ok?"Αναιρέθηκε: "+d.done:"Δεν υπάρχει κάτι για αναίρεση",3500)}).catch(()=>{undoBusy=false;drawUndo();say("Δεν έγινε η αναίρεση, δοκίμασε ξανά",4000)})}
function draw(){drawGrid();drawDet();drawIss();drawUndo()}
const load2=d=>{if(d&&d.people){D=d;draw()}},load=()=>fetch(API+"?plan="+encodeURIComponent(code)).then(r=>r.json()).then(d=>{if(d.denied)throw 0;load2(d)});
$("#q").addEventListener("input",()=>sugg($("#q").value,$("#sug"),pick));$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")close()});
$("#bU").onclick=undo;addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&e.key.toLowerCase()==="z"&&!/INPUT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();undo()}});
$("#bR").onclick=()=>{dlg('<h2>Στην τύχη, για δοκιμή</h2><p>Όσοι δεν έχουν τραπέζι μπαίνουν σε τυχαία θέση. Οι παρέες και τα ζευγάρια μένουν μαζί. Οι καλεσμένοι δεν βλέπουν το πρόχειρο και αναιρείται με ένα πάτημα.</p><div class="acts"><button class="main" id="dO">Στην τύχη</button><button id="dX">Άκυρο</button></div>');$("#dO").onclick=()=>{close();say("Υπολογισμός…");post({action:"random"}).then(d=>{load2(d);say(d.msg||"Έγινε",5000)})};$("#dX").onclick=close};
$("#bV").onclick=()=>{view=view==="map"?"cards":"map";$("#bV").textContent=view==="map"?"Κάρτες":"Κάτοψη";draw()};
$("#bP").onclick=()=>{say("Υπολογισμός…");post({action:"propose"}).then(d=>{load2(d);say(d.msg||"Έγινε",4000)})};
$("#bC").onclick=()=>{dlg('<h2>Άδειασμα πρόχειρου</h2><p>Θα φύγουν όλοι από τα τραπέζια. Οι σχέσεις μένουν και οι καλεσμένοι δεν βλέπουν το πρόχειρο.</p><div class="acts"><button class="bad" id="dO">Άδειασε</button><button id="dX">Άκυρο</button></div>');$("#dO").onclick=()=>{close();say("Αποθήκευση…");post({action:"clear"}).then(d=>{load2(d);say("Το πρόχειρο άδειασε",2500)})};$("#dX").onclick=close};
const enter=v=>{code=v;$("#le").hidden=true;return load().then(()=>{try{sessionStorage.setItem("plan",v)}catch(e){}$("#login").hidden=true;$("#app").hidden=false})};
