<h1>Οικόσημο · διάλεξε 1 από 10</h1><p class="i">Κάθε επιλογή έχει άλλο σχήμα, άλλη στάση του σκύλου και άλλο ρητό στην κορδέλα. Το μικρό δεξιά δείχνει πώς φαίνεται σε ανοιχτό χαρτί. Μπορείς να συνδυάσεις, π.χ. «το 4 με το ρητό του 1».</p>
