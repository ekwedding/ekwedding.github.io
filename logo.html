<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Λογότυπο · Maltese χαρακτικό</title>
<link href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,wght@1,300&family=Pinyon+Script&family=GFS+Didot&family=Ysabeau:wght@400;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#15291f;color:#f5ece0;font:15px Ysabeau,sans-serif;padding:20px 14px 60px}h1{font:italic 300 32px Piazzolla,serif;margin:0 0 6px}p.i{opacity:.85;margin:0 0 18px;line-height:1.5}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}figure{margin:0;background:#1f3b2d;border-radius:14px;padding:10px;position:relative}figure canvas{display:block;width:100%;height:auto;border-radius:8px}
.n{position:absolute;left:18px;top:14px;font:italic 300 24px Piazzolla,serif;color:#d9b46a;text-shadow:0 1px 3px rgba(0,0,0,.4)}figcaption{font-weight:600;text-align:center;margin-top:8px}.src{margin-top:26px;font-size:13px;opacity:.75}.src a{color:#d9b46a}</style></head><body>
<h1>Το λογότυπο με το Maltese</h1><p class="i">Από πραγματικό χαρακτικό του 1844 («The Lion-Dog of Malta», μετά τον Landseer), ελεύθερο από δικαιώματα. Κάθε τρίχα είναι χαραγμένη με το χέρι. Διάλεξε νούμερο.</p><main id="m"></main>
<p class="src">Πηγή: Metropolitan Museum of Art, Open Access (CC0), μέσω <a href="https://commons.wikimedia.org/wiki/File:The_Lion-Dog_of_Malta--The_Last_of_His_Tribe_MET_DP876563.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>.</p>
<script>
const W=800,H=900,PAPER=[243,236,224],SEPIA=[58,36,23],GREEN=[31,59,45],IVORY=[245,236,224],GOLD=[217,180,106],DG=[21,41,31];
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
/* the engraving turned into two colours: light parts become `light`, the lines become `dark`; outside a soft oval it fades into the background */
function tone(img,sx,sy,sw,sh,w,h,dark,light,bg,oval,gamma=.85){const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");g.drawImage(img,sx,sy,sw,sh,0,0,w,h);const d=g.getImageData(0,0,w,h),p=d.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const k=(y*w+x)*4;let L=(p[k]*.3+p[k+1]*.59+p[k+2]*.11)/255;L=Math.min(1,Math.max(0,(L-.32)/.5));L=L*L*(3-2*L);L=Math.pow(L,gamma);
    let a=1;if(oval){const dx=(x-oval[0])/oval[2],dy=(y-oval[1])/oval[3],r=Math.sqrt(dx*dx+dy*dy);a=r<.86?1:r>1?0:1-(r-.86)/.14;a=a*a*(3-2*a)}
    for(let j=0;j<3;j++){const v=dark[j]+(light[j]-dark[j])*L;p[k+j]=bg[j]+(v-bg[j])*a}p[k+3]=255}g.putImageData(d,0,0);return c}
function card(n,cap,draw){const f=document.createElement("figure"),c=document.createElement("canvas");c.width=W;c.height=H;f.innerHTML=`<div class="n">${n}</div>`;f.prepend(c);const fc=document.createElement("figcaption");fc.textContent=n+". "+cap;f.append(fc);document.getElementById("m").append(f);draw(c.getContext("2d"))}
const rgb=a=>`rgb(${a})`,txt=(g,t,x,y,font,col,ls)=>{g.font=font;g.fillStyle=col;g.textAlign="center";if(ls)g.letterSpacing=ls;g.fillText(t,x,y);g.letterSpacing="0px"};
function ring(g,cx,cy,r,col,w){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.arc(cx,cy,r,0,7);g.stroke()}
function arcText(g,t,cx,cy,r,a0,font,col,inv){g.font=font;g.fillStyle=col;g.textAlign="center";const ws=[...t].map(ch=>g.measureText(ch).width+3),tot=ws.reduce((a,b)=>a+b,0);let a=a0-(inv?-1:1)*tot/r/2;
  [...t].forEach((ch,i)=>{const da=ws[i]/r;a+=(inv?-1:1)*da/2;g.save();g.translate(cx+Math.cos(a)*r,cy+Math.sin(a)*r);g.rotate(a+(inv?-Math.PI/2:Math.PI/2));g.fillText(ch,0,0);g.restore();a+=(inv?-1:1)*da/2})}
function ribbon(g,cx,y,w,t,fill,ink){g.fillStyle=fill;g.beginPath();g.moveTo(cx-w/2-40,y+6);g.lineTo(cx-w/2+10,y-4);g.lineTo(cx-w/2+10,y+44);g.lineTo(cx-w/2-40,y+54);g.lineTo(cx-w/2-22,y+30);g.closePath();g.fill();g.beginPath();g.moveTo(cx+w/2+40,y+6);g.lineTo(cx+w/2-10,y-4);g.lineTo(cx+w/2-10,y+44);g.lineTo(cx+w/2+40,y+54);g.lineTo(cx+w/2+22,y+30);g.closePath();g.fill();
  g.beginPath();g.moveTo(cx-w/2,y);g.quadraticCurveTo(cx,y-26,cx+w/2,y);g.lineTo(cx+w/2,y+40);g.quadraticCurveTo(cx,y+14,cx-w/2,y+40);g.closePath();g.fill();txt(g,t,cx,y+26,"600 26px 'GFS Didot',serif",rgb(ink),"6px")}
function leaves(g,cx,cy,r,a0,a1,n,col,side){g.fillStyle=col;g.strokeStyle=col;g.lineWidth=2.5;g.beginPath();for(let i=0;i<=30;i++){const a=a0+(a1-a0)*i/30,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();
  for(let i=0;i<n;i++){const t=(i+.5)/n,a=a0+(a1-a0)*t,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;g.save();g.translate(x,y);g.rotate(a+(a1>a0?Math.PI/2:-Math.PI/2)+(i%2?.6:-.6)*side);g.beginPath();g.ellipse(0,-16,6,16,0,0,7);g.fill();g.restore()}}
(async()=>{await document.fonts.ready;await Promise.all(["400 26px 'Pinyon Script'","600 26px 'GFS Didot'","italic 300 26px Piazzolla"].map(f=>document.fonts.load(f)));
 const head=await load("assets/maltese_head.jpg"),body=await load("assets/maltese_body.jpg");
 const HEAD=(g,dark,light,bg,x,y,w,h,ov)=>g.drawImage(tone(head,60,0,880,880,w,h,dark,light,bg,ov||[w/2,h*.52,w*.46,h*.47]),x,y);
 card(1,"Σέπια σε χαρτί",g=>{g.fillStyle=rgb(PAPER);g.fillRect(0,0,W,H);HEAD(g,SEPIA,PAPER,PAPER,40,20,720,720);txt(g,"E K",W/2,830,"400 92px 'Pinyon Script',cursive",rgb(SEPIA))});
 card(2,"Μετάλλιο με διπλό δαχτυλίδι",g=>{g.fillStyle=rgb(PAPER);g.fillRect(0,0,W,H);g.save();g.beginPath();g.arc(400,400,330,0,7);g.clip();HEAD(g,SEPIA,PAPER,PAPER,40,40,720,720,[360,330,420,440]);g.restore();ring(g,400,400,338,rgb(SEPIA),5);ring(g,400,400,352,rgb(SEPIA),1.5);txt(g,"Ευάγγελος & Κωνσταντίνα Αλίκη",400,830,"italic 300 40px Piazzolla,serif",rgb(SEPIA))});
 card(3,"Πράσινο μελάνι, όπως η πρόσκληση",g=>{g.fillStyle=rgb(IVORY);g.fillRect(0,0,W,H);HEAD(g,GREEN,IVORY,IVORY,40,20,720,720);txt(g,"E K",W/2,830,"400 92px 'Pinyon Script',cursive",rgb(GREEN))});
 card(4,"Ιβουάρ σε σκούρο πράσινο",g=>{g.fillStyle=rgb(GREEN);g.fillRect(0,0,W,H);HEAD(g,GREEN,IVORY,GREEN,40,20,720,720);txt(g,"E K",W/2,830,"400 92px 'Pinyon Script',cursive",rgb(IVORY))});
 card(5,"Χρυσό σε πράσινο",g=>{g.fillStyle=rgb(DG);g.fillRect(0,0,W,H);HEAD(g,DG,GOLD,DG,40,20,720,720);txt(g,"E K",W/2,830,"400 92px 'Pinyon Script',cursive",rgb(GOLD))});
 card(6,"Σφραγίδα με τα ονόματα",g=>{g.fillStyle=rgb(PAPER);g.fillRect(0,0,W,H);g.save();g.beginPath();g.arc(400,450,280,0,7);g.clip();HEAD(g,SEPIA,PAPER,PAPER,90,140,620,620,[310,280,360,380]);g.restore();ring(g,400,450,288,rgb(SEPIA),4);ring(g,400,450,372,rgb(SEPIA),4);ring(g,400,450,380,rgb(SEPIA),1.5);
   arcText(g,"ΕΥΑΓΓΕΛΟΣ · ΚΩΝΣΤΑΝΤΙΝΑ ΑΛΙΚΗ",400,450,318,-Math.PI/2,"600 30px 'GFS Didot',serif",rgb(SEPIA));arcText(g,"20 · 08 · 2027",400,450,346,Math.PI/2,"600 30px 'GFS Didot',serif",rgb(SEPIA),true)});
 card(7,"Με κορδέλα FÜR IMMER WIR",g=>{g.fillStyle=rgb(PAPER);g.fillRect(0,0,W,H);HEAD(g,SEPIA,PAPER,PAPER,60,10,680,680);ribbon(g,400,740,460,"FÜR IMMER WIR",rgb(SEPIA),PAPER)});
 card(8,"Ολόσωμο, ξαπλωμένο",g=>{g.fillStyle=rgb(PAPER);g.fillRect(0,0,W,H);g.drawImage(tone(body,120,0,1680,1500,800,714,SEPIA,PAPER,PAPER,[420,330,380,330]),0,40);txt(g,"Ευάγγελος & Κωνσταντίνα Αλίκη",400,800,"italic 300 40px Piazzolla,serif",rgb(SEPIA));txt(g,"20 · 08 · 2027",400,850,"600 24px 'GFS Didot',serif",rgb(SEPIA),"8px")});
 card(9,"Με κλαδιά ελιάς και βελανιδιάς",g=>{g.fillStyle=rgb(IVORY);g.fillRect(0,0,W,H);HEAD(g,GREEN,IVORY,IVORY,130,60,540,540,[270,250,250,280]);leaves(g,400,360,330,Math.PI*.62,Math.PI*1.2,12,rgb(GREEN),1);leaves(g,400,360,330,Math.PI*.38,-Math.PI*.2,12,rgb(GREEN),-1);ribbon(g,400,700,420,"FÜR IMMER WIR",rgb(GREEN),IVORY);txt(g,"E K",W/2,850,"400 72px 'Pinyon Script',cursive",rgb(GREEN))});
 card(10,"Μικρό στρογγυλό (για εικονίδιο)",g=>{g.fillStyle=rgb(GREEN);g.fillRect(0,0,W,H);g.save();g.beginPath();g.arc(400,420,300,0,7);g.clip();g.drawImage(tone(head,200,60,600,600,600,600,GREEN,IVORY,GREEN,null),100,120);g.restore();ring(g,400,420,312,rgb(GOLD),6);txt(g,"E K",W/2,830,"400 80px 'Pinyon Script',cursive",rgb(IVORY))});
 document.body.dataset.ready=1})();
</script></body></html>
