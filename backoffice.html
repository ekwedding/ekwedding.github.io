<section id="gate"><div class="in">
 <svg class="crest" viewBox="0 0 300 340" aria-hidden="true"><use href="#crest"/></svg>
 <h1>Back office</h1><p class="k">Ευάγγελος &amp; Κωνσταντίνα Αλίκη · 20.08.2027</p>
 <div class="who" id="who">
  <button type="button" data-r="couple"><i>EK</i><span><b>Για εμάς</b><small>Πλάνο, αποστολές, καλεσμένοι, όλα τα αρχεία</small></span><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
  <button type="button" data-r="planner"><i>P</i><span><b>Για την event planner</b><small>Λίστα εισόδου, τραπέζια, θέσεις, Excel</small></span><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
 </div>
 <form class="code" id="cf" hidden><p id="cfH" style="margin:0"></p><input id="code" type="password" autocomplete="off" autocapitalize="off" placeholder="Κωδικός"><button class="btn">Είσοδος</button><button type="button" class="btn ghost" id="back">Πίσω</button><p class="err" id="err"></p></form>
</div></section>
<section id="app">
 <header><svg class="crest" viewBox="0 0 300 340" aria-hidden="true"><use href="#crest"/></svg><h2 id="hT"></h2><button class="btn ghost" id="out" type="button">Έξοδος</button></header>
 <div><div class="stats" id="stats"></div><div class="pub" id="pub" hidden><div><b>Τραπέζια για τους καλεσμένους</b><small id="pubWhen"></small></div><button type="button" id="pubB">Κοινοποίηση</button></div><p class="pubm" id="pubMsg" aria-live="polite"></p>
<nav class="tabs" id="tabs"></nav></div>
 <main id="view"></main>
</section>
<script>
const API="https://script.google.com/macros/s/AKfycbyXsQxEqpwThf_YAv5o1yZVHXoVl8OiKRJQw1J4kpEOkjMKFUAl4oHK2LMycmeP4wcG3w/exec";
const $=s=>document.querySelector(s);let role=null,D=null;
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}};
$("#who").querySelectorAll("button").forEach(b=>b.onclick=()=>{role=b.dataset.r;$("#who").hidden=true;$("#cf").hidden=false;$("#cfH").textContent=role==="couple"?"Ο κωδικός σας":"Ο κωδικός της planner";$("#err").textContent="";$("#code").value="";$("#code").focus()});
$("#back").onclick=()=>{$("#cf").hidden=true;$("#who").hidden=false};
$("#cf").addEventListener("submit",e=>{e.preventDefault();login(role,$("#code").value.trim())});
$("#out").onclick=()=>{ss.set("bo",null);location.reload()};
function login(r,c){$("#err").textContent="Έλεγχος…";fetch(API+"?bo="+encodeURIComponent(c)+"&role="+r).then(x=>x.json()).then(d=>{if(d.denied){$("#err").textContent="Λάθος κωδικός.";ss.set("bo",null);return}ss.set("bo",JSON.stringify([r,c]));D=d;show()}).catch(()=>{$("#err").textContent="Δεν συνδέθηκε, δοκίμασε ξανά."})}
const ar='<svg viewBox="0 0 16 16"><path d="M5 11L11 5M6 5h5v5"/></svg>';
function show(){$("#gate").hidden=true;$("#app").classList.add("on");const c=D.role==="couple";$("#hT").innerHTML=(c?"Για εμάς":"Για την event planner")+"<small>Back office · γάμος 20.08.2027</small>";
  if(c&&D.stats){const s=D.stats;$("#stats").innerHTML=[["Μέρες",s.days],["Καλεσμένοι",s.guests],["Έρχονται",s.yes],["Δεν έρχονται",s.no],["Save the date",s.std+" / "+s.guests],["Προσκλήσεις",s.inv+" / "+s.guests]].map(([k,v])=>`<div><b>${v}</b><small>${k}</small></div>`).join("")}else $("#stats").innerHTML="";
  /* the share button: tables reach the site and the Wallet passes only when the two of you press it */
  const pw=t=>t?"Τελευταία κοινοποίηση: "+new Date(t).toLocaleString("el-GR",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}):"Δεν έχουν κοινοποιηθεί ακόμα. Οι αλλαγές στο πλάνο μένουν πρόχειρες μέχρι να πατήσετε Κοινοποίηση.";
  $("#pub").hidden=!c;if(c){$("#pubWhen").textContent=pw(D.lastPublish);$("#pubB").onclick=()=>{if(!confirm("Κοινοποίηση τραπεζιών;\n\nΤο πλάνο όπως είναι τώρα θα φανεί στο site και θα πάει στις κάρτες Google Wallet των καλεσμένων (με ειδοποίηση σε όσους άλλαξε τραπέζι)."))return;const b=$("#pubB");b.disabled=true;b.textContent="Κοινοποίηση…";$("#pubMsg").textContent="";
    fetch(API,{method:"POST",body:JSON.stringify({plan:D.plan,action:"publish"})}).then(x=>x.json()).then(r=>{if(!r||!r.ok)throw 0;D.lastPublish=r.at;$("#pubWhen").textContent=pw(r.at);$("#pubMsg").textContent="Έγινε. "+r.seated+" άτομα έχουν τραπέζι στο site. Οι κάρτες Wallet ενημερώνονται μέσα σε 1–2 λεπτά.";if($("#view iframe"))$("#view iframe").contentWindow.location.reload()}).catch(()=>{$("#pubMsg").textContent="Δεν έγινε η κοινοποίηση. Δοκίμασε ξανά."}).finally(()=>{b.disabled=false;b.textContent="Κοινοποίηση"})}}
  const T=c?[["plan","Πλάνο τραπεζιών"],["send","Αποστολές"],["door","Είσοδος"],["files","Αρχεία"]]:[["door","Είσοδος, τραπέζια, θέσεις"],["files","Αρχεία"]];
  $("#tabs").innerHTML=T.map(([k,t],i)=>`<button type="button" data-v="${k}" class="${i?"":"on"}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("#tabs").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));view(b.dataset.v)});view(T[0][0])}
