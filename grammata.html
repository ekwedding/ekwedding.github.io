<h1>Γραμματοσειρά για την πρόσκληση</h1><p class="i">Καλλιγραφικές γραμματοσειρές σαν αυτή του καρουζέλ (Pinyon) δεν υπάρχουν με ελληνικά γράμματα. Εδώ είναι οι πιο όμορφες πλάγιες/καλλιγραφικές που γράφουν σωστά ελληνικά. Διάλεξε νούμερο.</p><main><figure><div class="n">1</div><p class="nm" style="font-family:'Bona Nova';font-style:italic;font-weight:400">Ευάγγελος <span class=amp>&amp;</span><br>Κωνσταντίνα Αλίκη</p><p class="h" style="font-family:'Bona Nova';font-style:italic;font-weight:400">Θα έρθεις; · Το πρόγραμμα</p><figcaption><b>1. Bona Nova</b><span>Αυτή που έχει τώρα</span></figcaption></figure><figure><div class="n">2</div><p class="nm" style="font-family:'EB Garamond';font-style:italic;font-weight:400">Ευάγγελος <span class=amp>&amp;</span><br>Κωνσταντίνα Αλίκη</p><p class="h" style="font-family:'EB Garamond';font-style:italic;font-weight:400">Θα έρθεις; · Το πρόγραμμα</p><figcaption><b>2. EB Garamond</b><span>Κλασική, σαν παλιό βιβλίο</span></figcaption></figure><figure><div class="n">3</div><p class="nm" style="font-family:'Cardo';font-style:italic;font-weight:400">Ευάγγελος <span class=amp>&amp;</span><br>Κωνσταντίνα Αλίκη</p><p class="h" style="font-family:'Cardo';font-style:italic;font-weight:400">Θα έρθεις; · Το πρόγραμμα</p><figcaption><b>3. Cardo</b><span>Λεπτή, λόγια, με ωραία ελληνικά</span></figcaption></figure><figure><div class="n">4</div><p class="nm" style="font-family:'Vollkorn';font-style:italic;font-weight:400">Ευάγγελος <span class=amp>&amp;</span><br>Κωνσταντίνα Αλίκη</p><p class="h" style="font-family:'Vollkorn';font-style:italic;font-weight:400">Θα έρθεις; · Το πρόγραμμα</p><figcaption><b>4. Vollkorn</b><span>Πιο ζεστή και στρογγυλή</span></figcaption></figure><figure><div class="n">5</div><p class="nm" style="font-family:'Alegreya';font-style:italic;font-weight:400">Ευάγγελος <span class=amp>&amp;</span><br>Κωνσταντίνα Αλίκη</p><p class="h" style="font-family:'Alegreya';font-style:italic;font-weight:400">Θα έρθεις; · Το πρόγραμμα</p><figcaption><b>5. Alegreya</b><span>Σαν γραμμένη με πένα</span></figcaption></figure><figure><div class="n">6</div><p class="nm" style="font-family:'Noto Serif Display';font-style:italic;font-weight:300">Ευάγγελος <span class=amp>&amp;</span><br>Κωνσταντίνα Αλίκη</p><p class="h" style="font-family:'Noto Serif Display';font-style:italic;font-weight:300">Θα έρθεις; · Το πρόγραμμα</p><figcaption><b>6. Noto Serif Display</b><span>Λεπτή, ψηλή, πολύ κομψή</span></figcaption></figure><figure><div class="n">7</div><p class="nm" style="font-family:'Gentium Book Plus';font-style:italic;font-weight:400">Ευάγγελος <span class=amp>&amp;</span><br>Κωνσταντίνα Αλίκη</p><p class="h" style="font-family:'Gentium Book Plus';font-style:italic;font-weight:400">Θα έρθεις; · Το πρόγραμμα</p><figcaption><b>7. Gentium Book Plus</b><span>Ήρεμη και καθαρή</span></figcaption></figure><figure><div class="n">8</div><p class="nm" style="font-family:'Piazzolla';font-style:italic;font-weight:300">Ευάγγελος <span class=amp>&amp;</span><br>Κωνσταντίνα Αλίκη</p><p class="h" style="font-family:'Piazzolla';font-style:italic;font-weight:300">Θα έρθεις; · Το πρόγραμμα</p><figcaption><b>8. Piazzolla</b><span>Μοντέρνα καλλιγραφική πλάγια</span></figcaption></figure><figure><div class="n">9</div><p class="nm" style="font-family:'Mansalva';font-style:normal;font-weight:400">Ευάγγελος <span class=amp>&amp;</span><br>Κωνσταντίνα Αλίκη</p><p class="h" style="font-family:'Mansalva';font-style:normal;font-weight:400">Θα έρθεις; · Το πρόγραμμα</p><figcaption><b>9. Mansalva</b><span>Σαν γραμμένη με πινέλο στο χέρι</span></figcaption></figure><figure><div class="n">10</div><p class="nm" style="font-family:'Pinyon Script';font-style:normal;font-weight:400">Evangelos &amp; Konstantina Aliki</p><p class="h" style="font-family:'Noto Serif Display';font-style:italic;font-weight:300">Θα έρθεις; · Το πρόγραμμα</p><small>Οι τίτλοι στα ελληνικά με τη 6</small><figcaption><b>10. Pinyon Script</b><span>Τα ονόματα με λατινικ
